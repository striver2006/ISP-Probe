# ISP-Probe 配置
# 所有与本机环境相关的值都集中在这里，代码中不含硬编码地址。

iface:
  name: ""              # 留空自动识别物理网卡（会自动排除 clash TUN）
  bind_local_addr: false # 接口索引绑定已足够；开启后额外绑源地址做双保险

router:
  admin_url: "http://192.168.31.1"   # 面板上可点击的路由器管理页；留空则用默认路由网关
  rule_page_hint: "WAN口转发规则设置"

# 两条 WAN 线路。modem_ip 是分线 DNS 探测的入口：
# 向光猫 LAN IP 发 DNS 查询，包必然经路由器对应的 WAN 口出去。
links:
  - id: telecom
    name: "电信"
    wan_label: "WAN1优先"
    modem_ip: "192.168.10.1"
    expect_isp: ["chinanet", "telecom", "电信"]
  - id: mobile
    name: "移动"
    wan_label: "WAN2优先"
    modem_ip: "192.168.1.1"
    expect_isp: ["china mobile", "cmcc", "移动"]

probe:
  interval: 60s          # 每条线的探测间隔
  min_gap: 2s            # 同一光猫两次查询的最小间隔（实测：连发 5 次会触发限速全部超时）
  timeout: 5s
  fail_threshold: 3      # 连续失败多少次才告警，抑制抖动
  retry_slow: 3          # 判定故障前的降速重试次数，用于排除光猫限速
  cache_domain: "www.baidu.com"   # 测缓存响应延迟，同时可校验返回节点的运营商归属
  force_domain: "example.com"     # 用随机子域名强制完整递归，验证上游真的可达
  anchors:               # TCP connect 延迟锚点，必须是 IP:port（域名会走系统解析器拿到 fake-ip）
    - "223.5.5.5:443"
    - "119.29.29.29:443"

speed:
  streams: 6             # 并发连接数，单流跑不满千兆
  duration: 12s          # 单向测速时长
  # 下行测速源。要求：国内高速节点、文件足够大（4GB，避免短时间被下完后反复重连拉低读数）。
  # 第三个源会 302 到 CDN 域名，程序会自行跟随并对新域名重新做 DoH 解析。
  # 单条流跑不满带宽，会用 streams 条并发同时拉取（下面的源轮流分配）。
  download_urls:
    - "https://mirrors.tuna.tsinghua.edu.cn/ubuntu-releases/20.04.6/ubuntu-20.04.6-desktop-amd64.iso"
    - "https://mirrors.ustc.edu.cn/ubuntu-releases/20.04.6/ubuntu-20.04.6-desktop-amd64.iso"
    - "https://mirrors.aliyun.com/ubuntu-releases/20.04.6/ubuntu-20.04.6-desktop-amd64.iso"
  upload_url: "https://speed.cloudflare.com/__up"
  # 出口归属查询源，按顺序尝试。国内源放前面：这条链路在测速确认和
  # 切换检测时会反复走，用国际服务会让每次识别都卡十几秒。
  egress_urls:
    - "https://myip.ipip.net"
    - "https://cip.cc"
    - "http://ip-api.com/json/?fields=query,isp,org,as"

store:
  path: "isp-probe.db"
  raw_retain: 168h       # 原始采样保留 7 天，之后只留聚合

notify:
  desktop: true
  # 线路持续故障时重复提醒：首次告警后第 5/15/30/60 分钟各一次，之后每 60 分钟。
  # 只发通知、不写 events 表 —— 那张表保持「一次故障 = 一条 down + 一条 up」。
  repeat_alert: true

  # IM 群机器人。URL 里的 key/token 等同于密钥，**不要写在这里**（本文件随仓库
  # 提交），放到同目录下不被跟踪的 config.local.yaml 里。注意旁路文件里的
  # webhooks 是整体替换而非追加。配好后用 `isp-probe notify test` 验证。
  #
  # webhooks:
  #   - name: "企微告警群"
  #     kind: wecom          # wecom | dingtalk | feishu | custom
  #     url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=你的key"
  #     enabled: true
  #     events: ["down", "up", "down_repeat"]   # 留空即全部
  #     timeout: 8s
  #   - name: "钉钉群"
  #     kind: dingtalk
  #     url: "https://oapi.dingtalk.com/robot/send?access_token=你的access_token"
  #     secret: "SECxxxxxxxx"  # 机器人安全设置选「加签」时填，选关键词则留空
  #     enabled: true
  #   - name: "飞书群"
  #     kind: feishu
  #     # 群设置 → 群机器人 → 添加机器人 → 自定义机器人，复制它给的 Webhook 地址。
  #     # 末段那串 uuid 就是密钥，别写进本文件。
  #     url: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  #     # 安全设置选「签名校验」时填这里给的密钥；选「自定义关键词」或「IP 白名单」则留空。
  #     # 注意飞书的关键词是对消息正文做匹配，本工具发出的正文形如
  #     # 「ISP探针 · 线路故障 / 电信 线路故障：…」，关键词可以填「ISP探针」或「线路」。
  #     secret: ""
  #     enabled: true
  #     events: ["down", "up", "down_repeat"]
  #     timeout: 8s
  #   - name: "自建服务"
  #     kind: custom
  #     url: "https://example.com/hook"
  #     content_type: "application/json"
  #     body_template: '{"text":"{{.Message}}","kind":"{{.Kind}}","at":"{{.Time}}"}'
  #     enabled: true

web:
  # 改成 0.0.0.0:8686 可让局域网内其它设备（手机等）访问面板。
  # 一旦这么做，务必同时设置 token —— 否则任何连上同一网络的设备都能看到
  # 内网拓扑、光猫地址、网卡 MAC，还能触发一次跑满带宽的测速。
  listen: "127.0.0.1:8686"
  # 访问令牌。留空 = 不鉴权（仅监听环回时的默认行为）。
  # 本机访问永远放行，令牌只对来自其它设备的请求生效。建议写进 config.local.yaml。
  token: ""

log:
  # 留空时：前台运行输出到 stderr（与直接跑没区别），
  # 服务模式自动落到 <本文件所在目录>/logs/isp-probe.log。
  # 后台进程的 stderr 在 Windows 服务里等于丢弃，必须落文件才有排障可能。
  file: ""
  max_size_mb: 8         # 单文件超过这个大小就轮转
  keep: 3                # 保留几个历史文件（总占用 ≈ max_size_mb × (keep+1)）
